# Local development stack for SaigonBite.
# Usage:  docker compose up -d db     then   dotnet run --project src/SaigonBite.Web
# The web tier is compiled inside the SDK image because the host has no .NET SDK.
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saigonbite-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SaigonBite#2026}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  web:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: saigonbite-web
    depends_on:
      db:
        condition: service_healthy
    working_dir: /src
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:5080"
      ConnectionStrings__Default: "Server=db,1433;Database=SaigonBite;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SaigonBite#2026};TrustServerCertificate=True"
      VNPAY_TMN_CODE: "${VNPAY_TMN_CODE:-}"
      VNPAY_HASH_SECRET: "${VNPAY_HASH_SECRET:-}"
      VNPAY_URL: "${VNPAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}"
    ports:
      - "5080:5080"
    volumes:
      - ./:/src
      - nuget-cache:/root/.nuget/packages
    command: >
      sh -lc "dotnet restore src/SaigonBite.sln &&
              dotnet run --project src/SaigonBite.Web --urls http://+:5080"

volumes:
  mssql-data:
  nuget-cache:
