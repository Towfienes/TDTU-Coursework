<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SaigonBite — clickable prototype</title>
<style>
/* ============================================================ tokens === */
:root{
  --ink:#14201E; --ink-2:#3D4A47; --muted:#6B7A76;
  --line:#E3DFD5; --line-2:#CFC9BB;
  --paper:#F6F4EF; --card:#FFFFFF;
  --brand:#14654F; --brand-2:#0E4C3B; --brand-soft:#E4EFEA;
  --accent:#C2410C; --accent-soft:#FCEDE5;
  --warn:#9A3412; --warn-soft:#FDF0E8;
  --ok:#166534; --ok-soft:#E8F3EA;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 2px rgba(20,32,30,.06), 0 8px 24px rgba(20,32,30,.05);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font); color:var(--ink); background:var(--paper);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{margin:0;line-height:1.2}
:focus-visible{outline:2px solid var(--brand); outline-offset:2px; border-radius:6px}
.num{font-variant-numeric:tabular-nums}

/* ============================================================= shell === */
.app{
  display:grid; grid-template-columns:236px 1fr; grid-template-rows:60px 1fr;
  grid-template-areas:"top top" "side view"; height:100vh; overflow:hidden;
}
.topbar{
  grid-area:top; display:flex; align-items:center; gap:16px; padding:0 20px;
  background:var(--card); border-bottom:1px solid var(--line); z-index:5;
}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.02em; font-size:17px}
.brand .mark{width:30px;height:30px;border-radius:9px;background:var(--brand);display:grid;place-items:center}
.brand .mark svg{width:18px;height:18px}
.brand small{display:block;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.topbar .spacer{flex:1}
.chip{
  display:inline-flex; align-items:center; gap:7px; padding:6px 11px; border-radius:999px;
  background:var(--brand-soft); color:var(--brand-2); font-weight:600; font-size:12.5px; white-space:nowrap;
}
.chip .dot{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.chip.warn{background:var(--warn-soft); color:var(--warn)}
.chip.warn .dot{background:var(--warn)}
.seg{display:inline-flex; background:#EFEBE2; border-radius:999px; padding:3px; gap:2px}
.seg button{
  border:0; background:transparent; color:var(--ink-2); font-size:12.5px; font-weight:600;
  padding:5px 11px; border-radius:999px; white-space:nowrap;
}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(20,32,30,.14)}

.side{
  grid-area:side; background:var(--card); border-right:1px solid var(--line);
  padding:14px 12px; overflow-y:auto;
}
.side .grp{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted);
  font-weight:700; padding:14px 10px 6px}
.side a{
  display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:9px;
  color:var(--ink-2); font-weight:600; font-size:13.5px; margin-bottom:2px;
}
.side a svg{width:17px;height:17px;flex:0 0 auto;opacity:.75}
.side a:hover{background:#F4F1EA}
.side a[aria-current="page"]{background:var(--brand-soft); color:var(--brand-2)}
.side a[aria-current="page"] svg{opacity:1}
.side .count{margin-left:auto; background:var(--accent); color:#fff; font-size:11px;
  border-radius:999px; padding:1px 7px; font-weight:700}

.view{grid-area:view; overflow-y:auto; padding:26px 30px 40px; min-width:0}
.wrap{max-width:1120px; margin:0 auto; min-width:0}
.page-head{display:flex; align-items:flex-end; gap:16px; margin-bottom:18px; flex-wrap:wrap}
.page-head h1{font-size:26px; letter-spacing:-.02em}
.page-head p{margin:4px 0 0; color:var(--muted); font-size:13.5px; max-width:62ch}
.page-head .right{margin-left:auto; display:flex; gap:8px; align-items:center}

/* ============================================================= atoms === */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.card.pad{padding:16px 18px}
.card h2{font-size:15px; letter-spacing:-.01em}
.card h2 + .sub{margin-top:3px; color:var(--muted); font-size:12.5px}
.grid{display:grid; gap:14px}
.grid > *{min-width:0}
.stack > *{min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:18px; align-items:start}
.stack{display:grid; gap:14px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  border:1px solid var(--line-2); background:var(--card); color:var(--ink);
  padding:9px 14px; border-radius:9px; font-weight:650; font-size:13.5px;
}
.btn:hover{border-color:#B8B1A1}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.ghost{background:transparent; border-color:transparent}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn.sm{padding:6px 10px; font-size:12.5px; border-radius:8px}
.pill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700;
  padding:3px 9px; border-radius:999px; letter-spacing:.02em}
.pill.quiet{background:var(--accent-soft); color:var(--accent)}
.pill.busy{background:#F1EFE9; color:var(--ink-2); border:1px solid var(--line-2)}
.pill.stop{background:#FDE8E4; color:#9B2C1B}
.pill.ok{background:var(--ok-soft); color:var(--ok)}
.pill.tbd{background:#F1EFE9; color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:11px}
.hr{height:1px;background:var(--line);margin:12px 0}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap-row{flex-wrap:wrap}

/* hub + brand cards */
.hubcards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.hub{padding:15px 16px;cursor:pointer;border:1px solid var(--line);border-radius:var(--r);
  background:var(--card);box-shadow:var(--shadow);text-align:left;width:100%;display:block}
.hub[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.hub h3{font-size:15px}
.hub .addr{color:var(--muted);font-size:12px;margin-top:2px}
.meter{height:6px;background:#EFEBE2;border-radius:99px;overflow:hidden;margin:11px 0 7px}
.meter i{display:block;height:100%;border-radius:99px}
.meter i.quiet{background:var(--accent)}
.meter i.mid{background:#6B7A76}
.meter i.full{background:#1B1B1B}
.brands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.brandcard{padding:14px 15px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.brandcard .avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-weight:800;color:#fff;font-size:14px;margin-bottom:9px}
.brandcard h3{font-size:14px}
.brandcard .cat{color:var(--muted);font-size:12px;margin-top:2px}
.brandcard.off{opacity:.55}

/* menu */
.menu-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.dish{display:flex;gap:13px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.dish .thumb{width:56px;height:56px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;
  font-size:22px;background:#F3F0E8}
.dish .body{min-width:0;flex:1}
.dish h3{font-size:14px}
.dish .brand{color:var(--muted);font-size:11.5px;margin-top:1px}
.dish .foot{display:flex;align-items:center;gap:8px;margin-top:7px}
.dish .price{font-weight:750}
.dish .price small{font-weight:500;color:var(--muted)}
.dish.soldout{background:#FBFAF7}
.dish.soldout .thumb,.dish.soldout h3,.dish.soldout .price{opacity:.5}
.dish .add{margin-left:auto}

/* cart */
.cartline{display:grid;grid-template-columns:46px 1fr auto auto;gap:12px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line)}
.cartline:last-child{border-bottom:0}
.cartline .thumb{width:46px;height:46px;border-radius:9px;background:#F3F0E8;display:grid;place-items:center;font-size:19px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.qty button{width:28px;height:28px;border:0;background:var(--card);font-weight:700;color:var(--ink-2)}
.qty button:hover{background:#F4F1EA}
.qty span{min-width:26px;text-align:center;font-weight:650;font-size:13px}
.line-total{font-weight:700;min-width:78px;text-align:right}

/* price breakdown */
.rows{display:grid;gap:0}
.prow{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:13.5px;
  border-bottom:1px dashed #EBE6DB}
.prow:last-child{border-bottom:0}
.prow .lbl{color:var(--ink-2);display:flex;gap:8px;align-items:baseline}
.prow .stp{font-size:10px;color:#9AA3A0;font-weight:700;min-width:9px;font-variant-numeric:tabular-nums}
.prow .lbl b{color:var(--ink)}
.prow .amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.prow.disc .amt{color:var(--accent)}
.prow.sub{font-weight:700}
.prow.raw{color:var(--muted)}
.prow.raw .lbl{color:var(--muted)}
.prow.total{border-top:2px solid var(--ink);border-bottom:0;margin-top:6px;padding-top:10px;
  font-size:17px;font-weight:800}
.prow.total .amt{font-size:20px}
.rule-tag{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.04em;margin-left:6px}

/* conditions */
.cond{display:grid;gap:11px;margin-top:4px}
.cond label{display:grid;gap:4px;font-size:12.5px;color:var(--ink-2);font-weight:600}
.cond input[type=range]{width:100%;accent-color:var(--brand)}
.cond .val{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.cond select,.cond input[type=time],.cond input[type=text]{
  font:inherit;padding:6px 8px;border:1px solid var(--line-2);border-radius:8px;background:var(--card);width:100%}
.cond label.switch,.switch{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--ink-2);font-size:12.5px}
.switch input{accent-color:var(--brand);width:16px;height:16px}
.alert{display:flex;gap:10px;padding:10px 12px;border-radius:9px;font-size:12.5px;line-height:1.4}
.alert.stop{background:var(--warn-soft);color:var(--warn);border:1px solid #F3D3C2}
.alert.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #CFE3D3}
.alert.info{background:#F2F5F4;color:var(--ink-2);border:1px solid var(--line)}

/* payment */
.pay{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.payopt{display:flex;align-items:center;gap:11px;padding:13px 14px;border:1px solid var(--line-2);
  border-radius:11px;background:var(--card);text-align:left;width:100%}
.payopt[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.payopt .logo{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px}
.payopt .nm{font-weight:700;font-size:13.5px}
.payopt .hint{font-size:11.5px;color:var(--muted)}
.payopt:disabled{opacity:.5;cursor:not-allowed}

/* timeline */
.tl{display:grid;gap:0;margin-top:4px}
.tlstep{display:grid;grid-template-columns:26px 1fr auto;gap:12px;padding-bottom:14px;position:relative}
.tlstep:last-child{padding-bottom:0}
.tlstep .bullet{width:26px;height:26px;border-radius:50%;border:2px solid var(--line-2);
  display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);background:var(--card);z-index:1}
.tlstep .bar{position:absolute;left:12px;top:26px;bottom:0;width:2px;background:#C9C2B2}
.tlstep:last-child .bar{display:none}
.tlstep.done .bullet{background:var(--brand);border-color:var(--brand);color:#fff}
.tlstep.done .bar{background:var(--brand)}
.tlstep.now .bar{background:repeating-linear-gradient(180deg,#C2410C 0 4px,transparent 4px 8px)}
.tlstep.now .bullet{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tlstep .name{font-weight:700;font-size:13.5px}
.tlstep .meta{font-size:12px;color:var(--muted)}
.tlstep .stamp{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.terminals{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.term{flex:1;min-width:150px;border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;font-size:12.5px;color:var(--muted)}
.term b{display:block;color:var(--ink);font-size:13px;margin-bottom:2px}
.term.hit{border-style:solid;border-color:#9B2C1B;background:#FDF1EE;color:var(--ink-2)}
.log{max-height:150px;overflow:auto;font-size:12px}
.log div{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid #F0ECE3}
.log div:last-child{border-bottom:0}
.log .t{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* tables */
.scrollx{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:700;padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
td{padding:9px 10px 9px 0;border-bottom:1px solid #F0ECE3;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}

/* kpi */
.kpi{display:flex;flex-direction:column;gap:3px;padding:14px 16px;border:1px solid var(--line);
  border-radius:var(--r);background:var(--card);box-shadow:var(--shadow)}
.kpi .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* rails + chips + diagrams */
.rail{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mini{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card)}
.mini .thumb{width:42px;height:42px;border-radius:9px;background:#F3F0E8;display:grid;place-items:center;font-size:18px;flex:0 0 auto}
.mini h4{font-size:13px;line-height:1.25}
.mini .p{font-size:12.5px;font-weight:700;margin-top:2px}
.mini .brand{font-size:11px;color:var(--muted)}
.mini button{margin-left:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chipbtn{border:1px solid var(--line-2);background:var(--card);border-radius:999px;
  padding:6px 13px;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.chipbtn[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.secttl{display:flex;align-items:baseline;gap:10px;margin:24px 0 10px}
.secttl h2{font-size:15px}
.secttl span{font-size:12px;color:var(--muted)}
.meterrow{display:grid;grid-template-columns:120px 1fr 64px;gap:12px;align-items:center;
  padding:7px 0;font-size:13px}
.diagramcard{padding:14px 18px 10px}
.diagramcard svg{width:100%;height:auto;display:block}
.dlegend{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin-top:2px}
.dlegend span{display:inline-flex;align-items:center;gap:6px}
.dlegend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.step3{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--card)}
.step3 .n{width:22px;height:22px;border-radius:50%;background:var(--brand-soft);color:var(--brand-2);
  display:grid;place-items:center;font-size:11.5px;font-weight:800;margin-bottom:7px}
.step3 b{font-size:13px;display:block}
.step3 span{font-size:12px;color:var(--muted)}
.bar-cell{height:6px;border-radius:99px;background:#EFEBE2;overflow:hidden;min-width:70px}
.bar-cell i{display:block;height:100%;border-radius:99px;background:var(--brand)}

/* misc */
.note{font-size:12px;color:var(--muted);line-height:1.45}
.kicker{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.bar-chart text{font-family:var(--font)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ========================================================== responsive == */
@media (max-width:1180px){
  .brands{grid-template-columns:repeat(2,minmax(0,1fr))}
  .split{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr); grid-template-rows:56px auto 1fr;
       grid-template-areas:"top" "side" "view"; height:auto; min-height:100vh; overflow:visible}
  .side{display:flex; gap:6px; overflow-x:auto; border-right:0; border-bottom:1px solid var(--line);
        padding:8px 12px; position:sticky; top:56px; z-index:4}
  .side .grp{display:none}
  .side a{white-space:nowrap; font-size:13px; padding:7px 10px}
  .view{padding:18px 16px 32px; overflow:visible}
  .hubcards,.pay,.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rail{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps3{grid-template-columns:1fr}
  .menu-grid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .app{grid-template-rows:auto auto 1fr}
  .topbar{flex-wrap:wrap; gap:8px; padding:8px 12px; height:auto; min-width:0}
  .topbar .spacer{display:none}
  .brand{flex:1 1 auto; min-width:0}
  .brand small{display:none}
  .topbar .chip{display:none}
  .topbar .seg{flex:0 0 auto}
  .seg button{padding:5px 8px; font-size:12px}
  .page-head h1{font-size:21px}
  .page-head .right{margin-left:0}
  .hubcards,.pay,.g2,.g3,.g4,.brands,.rail{grid-template-columns:minmax(0,1fr)}
  .view{padding:14px 12px 28px}
  .cartline{grid-template-columns:40px 1fr; row-gap:8px}
  .cartline .qty{grid-column:2}
  .line-total{grid-column:2; text-align:left}
  .menu-grid{grid-template-columns:1fr}
  .diagramcard{overflow-x:auto}
  table{min-width:520px}
  .diagramcard svg{min-width:620px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M4 10h16"/><path d="M5 10a7 7 0 0 1 14 0"/><path d="M12 3v1.2"/>
          <path d="M4 14h16"/><path d="M7 17h10"/>
        </svg>
      </span>
      <span>SaigonBite<small data-i18n="tagline">Cloud kitchens · Ho Chi Minh City</small></span>
    </div>
    <div class="spacer"></div>
    <span class="chip" id="hubChip"><span class="dot"></span><span></span></span>
    <div class="seg" role="group" aria-label="Customer type" id="typeSeg">
      <button data-act="type" data-v="local" aria-pressed="true" data-i18n="local">Local customer</button>
      <button data-act="type" data-v="tourist" aria-pressed="false" data-i18n="tourist">Foreign tourist</button>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button data-act="lang" data-v="en" aria-pressed="true">EN</button>
      <button data-act="lang" data-v="vi" aria-pressed="false">VI</button>
    </div>
  </header>

/* ============================================================== pricing == */
/* BR1–BR11, in the exact order of BR10. Pure: no DOM, no storage. */
function price(cart, ctx, voucher) {
  const lines = cart.map(l => ({ ...item(l.id), qty:l.qty })).filter(l => l);
  const S = lines.reduce((t,l) => t + l.price * l.qty, 0);
  const rejects = [];
  if (S > 0 && S < 50000) rejects.push('br1');
  if (ctx.distance > 8.0) rejects.push('br2');
  if (ctx.load >= 90) rejects.push('br8');

  const Q = ctx.load < 30 ? Math.round(S * 0.10) : 0;             // BR7
  let V = 0;
  if (voucher && voucher.active && S >= voucher.min && S > 0) {   // BR9
    V = voucher.type === 'PERCENT'
      ? Math.min(Math.floor((S - Q) * voucher.value / 100), voucher.max)
      : Math.min(voucher.value, S - Q);
  }
  const F = S - Q - V;                                            // BR10 step 4

  let D = ctx.distance <= 2 ? 15000
        : ctx.distance <= 5 ? 15000 + 5000 * Math.ceil(ctx.distance - 2)
        : 30000 + 7000 * Math.ceil(ctx.distance - 5);             // BR3
  if (S >= 300000) D = 0;                                         // BR6

  const mins = (t) => { const [h,m] = t.split(':').map(Number); return h*60+m; };
  const tm = mins(ctx.time);
  const rushWin = (tm >= 660 && tm < 780) || (tm >= 1050 && tm < 1170); // BR4 [11:00,13:00) [17:30,19:30)
  const R = (rushWin && D > 0) ? Math.round(D * 0.20) : 0;
  const R2 = ctx.rain ? 10000 : 0;                                // BR5

  const raw = F + D + R + R2;
  const total = Math.round(raw / 1000) * 1000;                    // BR11, once
  return { S, Q, V, F, D, R, R2, raw, total, rejects, rushWin };
}

    const isDeliver = m.to === 'Delivered';
    let disabled = false, hint = '';
    if (isDispatch && !o.shipper) { disabled = true; hint = T('assignFirst'); }
    if (isDeliver && o.method === 'cod' && !o.cash) { disabled = true; hint = T('cashConfirm'); }
    const label = isDispatch ? T('assignShipper') + ' →' + L(STATES.find(s => s.id === 'OutForDelivery'))
      : L(STATES.find(s => s.id === m.to) || { en:m.to, vi:m.to });
    return `<div><button class="btn ${isDeliver ? 'primary' : ''}" data-act="move" data-v="${m.to}" ${disabled ? 'disabled' : ''}>${label}</button>
      ${hint ? `<div class="tiny muted" style="margin-top:4px">${hint}</div>` : ''}</div>`;
  }).join('');

  const canAssign = o.status === 'Ready' && !o.shipper && ['shipper','admin'].includes(state.role);
  const log = o.log.slice().reverse().slice(0, 8).map(l => `<div>
      <span class="t">${l.at}</span>
      <span class="small">${l.from === '—' ? '' : l.from + ' → '}${l.to} · <b>${l.role}</b></span></div>`).join('');

  return pageHead(T('trackTitle'), T('trackSub'),
      `<span class="chip"><span class="dot"></span>${T('orderNo')} ${o.no}</span>`) +
    `<div class="split">
      <div class="card pad">
        <div class="row between">
          <div><h2>${T('orderNo')} ${o.no}</h2>
            <div class="sub">${L(hub().name)} · ${T('placedAt')} ${o.at} · ${vnd(totalNow().total)} ₫</div></div>
          ${loadPill(state.cond.load)}
        </div>
        <div class="hr"></div>
        <div class="tl">${steps}</div>
        <div class="terminals">
          <div class="term ${o.status === 'Cancelled' ? 'hit' : ''}"><b>${T('cancelled')}</b>${T('terminal')}</div>
          <div class="term ${o.status === 'Failed' ? 'hit' : ''}"><b>${T('failed')}</b>${T('terminal')}</div>
        </div>
        ${o.status === 'Delivered' ? `<div class="alert ok" style="margin-top:14px">${T('delivered')} · ${o.no}</div>` : ''}
      </div>

      <div class="stack">
        <div class="card pad">
          <h2>${T('actingAs')}</h2>
          <div class="seg" style="margin-top:8px;flex-wrap:wrap" role="group">
            ${['customer','kitchen','shipper','admin'].map(r =>
              `<button data-act="role" data-v="${r}" aria-pressed="${state.role === r}">${T(r)}</button>`).join('')}
          </div>
          <div class="hr"></div>
          <div class="kicker">${T('legalMoves')}</div>
          <div class="row wrap-row" style="margin-top:8px;gap:10px">
            ${buttons || `<span class="muted small">${T('noMoves')}</span>`}
          </div>
          ${canAssign ? `<button class="btn sm" style="margin-top:10px" data-act="assign">${T('assignShipper')} · Trần Quốc Bảo</button>` : ''}
          ${o.shipper ? `<div class="alert ok" style="margin-top:10px">${T('assigned')}: ${o.shipper}</div>` : ''}
          ${o.method === 'cod' && o.status === 'OutForDelivery' ? `
            <label class="switch" style="margin-top:12px">
              <input type="checkbox" data-act="cash" ${o.cash ? 'checked' : ''}> ${T('cashOk')} · BR14
            </label>` : ''}
          <div class="hr"></div>
          <button class="btn sm" data-act="illegal">${T('tryIllegal')}</button>
          <div id="illegalMsg">${state.note ? `<div class="alert stop" style="margin-top:8px">${state.note}</div>` : ''}</div>
        </div>

        <div class="card pad">
          <h2>${T('history')}</h2>
          <div class="log" style="margin-top:8px">${log || `<span class="muted small">${T('noHistory')}</span>`}</div>
        </div>
      </div>
    </div>
    <div class="secttl"><h2>${T('machine')}</h2><span>BR15 · BR16</span></div>
    <div class="card diagramcard">${stateMachineSVG()}</div>`;
}

function screenRevenue() {
  const total = SEED.revenueByCategory.reduce((t, r) => t + r.vnd, 0);
  const rows = SEED.revenueByCategory.map(r => {
    const b = r.id === 'drinks' ? { name:{en:'Drinks', vi:'Đồ uống'} } : brand(r.id);
    const share = r.vnd / total * 100;
    const maxShare = SEED.revenueByCategory[0].vnd / total * 100;
    return `<tr><td>${L(b.name)}</td>
      <td class="n">${vnd(r.vnd)} ₫</td>
      <td class="n">${share.toFixed(1)} %</td>
      <td style="width:120px"><div class="bar-cell"><i style="width:${(share / maxShare * 100).toFixed(0)}%"></i></div></td></tr>`;
  }).join('');
  const meth = SEED.revenueByMethod.map(m => {
    const p = PAYMENTS.find(x => x.id === m.id);
    return `<tr><td><span class="row" style="gap:8px"><i style="width:9px;height:9px;border-radius:3px;background:${p.color};display:inline-block"></i>${p.label}</span></td>
      <td class="n">${m.orders}</td><td class="n">${vnd(m.vnd)} ₫</td></tr>`;
  }).join('');

  return pageHead(T('revenueTitle'), T('revenueSub'),
      `<span class="chip">01/10/2026 – 23/10/2026</span>`) +
    `<div class="grid g3" style="margin-bottom:14px">
      <div class="kpi"><span class="k">${T('totalRevenue')}</span><span class="v num">${vnd(total)} ₫</span>
        <span class="d">214 ${T('orders').toLowerCase()}</span></div>
      <div class="kpi"><span class="k">${T('excluded')}</span><span class="v num">14</span>
        <span class="d">11 ${T('cancelled').toLowerCase()} · 3 ${T('failed').toLowerCase()}</span></div>
      <div class="kpi"><span class="k">${T('avgPrep')}</span><span class="v num">12,4 min</span>
        <span class="d">${T('prepNote')}</span></div>
    </div>
    <div class="grid g2">
      <div class="card pad">
        <h2>${T('byCategory')}</h2>
        <div class="scrollx"><table style="margin-top:10px"><thead><tr><th>${T('cat')}</th>
          <th class="n">VND</th><th class="n">${T('share')}</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td>${T('total')}</td><td class="n">${vnd(total)} ₫</td><td class="n">100 %</td><td></td></tr></tfoot>
        </table></div>
      </div>
      <div class="stack">
        <div class="card pad">
          <h2>${T('byMethod')}</h2>
          <div class="scrollx"><table style="margin-top:10px"><thead><tr><th>${T('method')}</th>
            <th class="n">${T('ordersCount')}</th><th class="n">VND</th></tr></thead>
            <tbody>${meth}</tbody></table></div>
        </div>
        <div class="alert info">${T('revenueSub')} ${T('demoData')} · R1</div>
      </div>
    </div>
    <div class="card pad" style="margin-top:14px">
      <h2>${T('topDishes')}</h2>
      <div class="scrollx"><table style="margin-top:10px">
        <thead><tr><th>${T('dish')}</th><th class="n">${T('units')}</th>
          <th class="n">VND</th><th style="width:160px"></th></tr></thead>
        <tbody>
          ${[['pho-bo',54,3240000],['bmi-thit',64,2880000],['comtam',42,2460000],['goicuon',54,1890000],['tra-dao',48,960000]]
            .map(([id,n,v]) => {
              const it = item(id);
              return `<tr><td>${L(it.name)} <span class="tiny muted">· ${L(brand(it.brand).name)}</span></td>
                <td class="n">${n}</td><td class="n">${vnd(v)} ₫</td>
                <td><div class="bar-cell"><i style="width:${(v / 3240000 * 100).toFixed(0)}%"></i></div></td></tr>`;

function screenUtilization() {
  const rows = SEED.utilization.map(u => {
    const h = HUBS.find(x => x.id === u.hub);
    return `<tr><td><b>${L(h.name)}</b><div class="tiny muted">${h.addr}</div></td>
      <td class="n">${u.orders}</td><td class="n">${u.prep.toFixed(1)} min</td>
      <td class="n">${u.load} %</td><td class="n">${u.quiet}</td>
      <td>${loadPill(u.load)}</td></tr>`;
  }).join('');
  const meters = SEED.utilization.map(u => {
    const h = HUBS.find(x => x.id === u.hub);
    const cls = u.load < 30 ? 'quiet' : u.load >= 90 ? 'full' : 'mid';
    return `<div class="meterrow"><span>${L(h.name)}</span>
      <span class="meter" style="margin:0"><i class="${cls}" style="width:${u.load}%"></i></span>
      <b class="num" style="text-align:right">${u.load} %</b></div>`;
  }).join('');
  const orders = SEED.utilization.reduce((t, u) => t + u.orders, 0);
  const quiet = SEED.utilization.reduce((t, u) => t + u.quiet, 0);
  const prep = SEED.utilization.reduce((t, u) => t + u.prep, 0) / SEED.utilization.length;

  return pageHead(T('utilTitle'), T('utilSub'), `<span class="chip">01/10/2026 – 23/10/2026</span>`) +
    `<div class="grid g3" style="margin-bottom:14px">
      <div class="kpi"><span class="k">${T('reporting')}</span><span class="v num">3</span>
        <span class="d">${T('ordersHandled')}: ${orders}</span></div>
      <div class="kpi"><span class="k">${T('avgPrep')}</span><span class="v num">${prep.toFixed(1)} min</span>
        <span class="d">${T('prepNote')}</span></div>
      <div class="kpi"><span class="k">${T('quietGiven')}</span><span class="v num">${quiet}</span>
        <span class="d">BR7 · 10 % off</span></div>
    </div>
    <div class="grid g2">
      <div class="card pad">
        <h2>${T('loadByHub')}</h2>
        <div class="sub">BR8 · 90 % = ${T('refused').toLowerCase()}</div>
        <div style="margin-top:10px">${meters}</div>
      </div>
      <div class="card pad">
        <h2>${T('prep')}</h2>
        <div class="sub">Confirmed → Ready · ${T('prepScale')}</div>
        <div style="margin-top:10px">
          ${SEED.utilization.map(u => {
            const h = HUBS.find(x => x.id === u.hub);
            const pct = Math.round(u.prep / 20 * 100);
            return `<div class="meterrow"><span>${L(h.name)}</span>
              <span class="meter" style="margin:0"><i class="mid" style="width:${pct}%"></i></span>
              <b class="num" style="text-align:right">${u.prep.toFixed(1)}′</b></div>`;

        <p class="note" style="margin-top:10px">${T('prepNote')}</p>
      </div>
    </div>
    <div class="card pad" style="margin-top:14px">
      <div class="scrollx"><table><thead><tr><th>${T('hub')}</th><th class="n">${T('ordersHandled')}</th>
        <th class="n">${T('prep')}</th><th class="n">${T('load')}</th>
        <th class="n">${T('qkGiven')}</th><th>${T('status')}</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      <p class="note" style="margin-top:12px">${T('demoData')} · R2 · ${T('prep')}: Confirmed → Ready</p>
    </div>`;
}

/* --- inline SVG charts ------------------------------------------------- */
function chartRevenue() {
  const data = SEED.revenueByCategory;
  const max = Math.max(...data.map(d => d.vnd));
  const rowH = 34, top = 8, left = 132, w = 520;
  const h = top + data.length * rowH + 18;
  const bars = data.map((d, i) => {
    const y = top + i * rowH;
    const bw = Math.round((d.vnd / max) * (w - left - 90));
    const b = d.id === 'drinks' ? { name:{en:'Drinks', vi:'Đồ uống'} } : brand(d.id);
    const ramp = ['#0E4C3B', '#14654F', '#2F7A63', '#5B9C88', '#9CC3B6'];
    return `<g>
      <text x="0" y="${y + 15}" font-size="12" fill="#3D4A47">${L(b.name)}</text>
      <rect x="${left}" y="${y + 3}" width="${w - left - 90}" height="17" rx="4" fill="#F0ECE3"></rect>
      <rect class="bar-chart" x="${left}" y="${y + 3}" width="${bw}" height="17" rx="4" fill="${ramp[i]}"></rect>
      <text x="${left + bw + 8}" y="${y + 16}" font-size="11.5" fill="#14201E" font-weight="700">${vnd(d.vnd / 1000)}k</text>
    </g>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${T('revChart')}">
    <text x="0" y="${h - 2}" font-size="10.5" fill="#6B7A76">VND (thousands) · ${T('demoData')}</text>
    ${bars}</svg>`;
}

function chartLoad() {
  const data = SEED.utilization;
  const w = 520, h = 210, left = 34, bottom = h - 34, top = 12;
  const bw = 74, gap = 54;
  const bars = data.map((u, i) => {
    const x = left + i * (bw + gap);
    const bh = Math.round((u.load / 100) * (bottom - top));
    const y = bottom - bh;
    const fill = u.load < 30 ? '#C2410C' : u.load >= 90 ? '#1B1B1B' : '#14654F';
    const name = L(HUBS.find(x => x.id === u.hub).name);
    return `<g>
      <rect x="${x}" y="${top}" width="${bw}" height="${bottom - top}" fill="#F5F2EA" rx="6"></rect>
      <rect x="${x}" y="${y}" width="${bw}" height="${bh}" fill="${fill}" rx="6"></rect>
      <text x="${x + bw / 2}" y="${y - 6}" font-size="11.5" text-anchor="middle" font-weight="700" fill="#14201E">${u.load} %</text>
      <text x="${x + bw / 2}" y="${bottom + 16}" font-size="11" text-anchor="middle" fill="#3D4A47">${name}</text>
    </g>`;
  }).join('');
  const ty = Math.round(bottom - (90 / 100) * (bottom - top));
  const grid = [0, 25, 50, 75, 100].map(v => {
    const y = Math.round(bottom - (v / 100) * (bottom - top));
    return `<line x1="${left - 6}" y1="${y}" x2="${w - 12}" y2="${y}" stroke="#EDE8DD"></line>
      <text x="${left - 10}" y="${y + 3.5}" font-size="9.5" text-anchor="end" fill="#8A8F8D">${v}</text>`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${T('loadChart')}">
    ${grid}
    <line x1="${left - 6}" y1="${ty}" x2="${w - 12}" y2="${ty}" stroke="#C2410C" stroke-width="1.6" stroke-dasharray="6 4"></line>
    <text x="${w - 12}" y="${ty - 6}" font-size="10.5" text-anchor="end" fill="#C2410C" font-weight="700">${T('threshold')}</text>
    <line x1="${left - 6}" y1="${bottom}" x2="${w - 12}" y2="${bottom}" stroke="#CFC9BB"></line>
    ${bars}</svg>`;
}

function screenDashboard() {
  const total = SEED.revenueByCategory.reduce((t, r) => t + r.vnd, 0);
  const avgPrep = (SEED.utilization.reduce((t, u) => t + u.prep, 0) / SEED.utilization.length);
  const quiet = SEED.utilization.reduce((t, u) => t + u.quiet, 0);
  const byState = [
    { id:'Placed', n:6 }, { id:'Confirmed', n:4 }, { id:'Preparing', n:3 }, { id:'Ready', n:2 },
    { id:'OutForDelivery', n:5 }, { id:'Delivered', n:87 }, { id:'Cancelled', n:11 }, { id:'Failed', n:3 }
  ];
  const nameOfState = (id) => {
    const st = STATES.find(x => x.id === id);
    return st ? L(st) : (id === 'Cancelled' ? T('cancelled') : T('failed'));
  };
  return pageHead(T('dashTitle'), T('dashSub'),
      `<span class="pill busy">${T('demoData')}</span>`) +
    `<div class="grid g4" style="margin-bottom:14px">
      <div class="kpi"><span class="k">${T('totalRevenue')}</span><span class="v num">${vnd(total)} ₫</span></div>
      <div class="kpi"><span class="k">${T('quietGiven')}</span><span class="v num">${quiet}</span></div>
      <div class="kpi"><span class="k">${T('avgPrep')}</span><span class="v num">${avgPrep.toFixed(1)} min</span></div>
      <div class="kpi"><span class="k">${T('hubsOnline')}</span><span class="v num">2 / 3</span></div>
    </div>
    <div class="grid g2">
      <div class="card pad"><h2>${T('revChart')}</h2><div class="sub">R1 · ${T('byCategory')}</div>
        <div style="margin-top:12px">${chartRevenue()}</div>
      </div>
      <div class="card pad"><h2>${T('loadChart')}</h2><div class="sub">R2 · ${T('load')}</div>
        <div style="margin-top:12px">${chartLoad()}</div>
        <div class="legend">
          <span><i style="background:#C2410C"></i>${T('quiet')} (&lt; 30 %)</span>
          <span><i style="background:#14654F"></i>${T('busy')} (30–89 %)</span>
          <span><i style="background:#1B1B1B"></i>${T('refused')} (≥ 90 %)</span>
        </div>
      </div>
    </div>
    <div class="card pad" style="margin-top:14px">
      <h2>${T('ordersByState')}</h2>
      <div class="grid" style="grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-top:10px">
        ${byState.map(s => `<div style="border:1px solid var(--line);border-radius:9px;padding:9px 10px">
          <div class="tiny muted" style="font-weight:700">${nameOfState(s.id)}</div>
          <div style="font-size:19px;font-weight:800" class="num">${s.n}</div></div>`).join('')}
      </div>
    </div>`;
}

/* =============================================================== render == */
const SCREENS = {
  hubs:screenHubs, menu:screenMenu, cart:screenCart, checkout:screenCheckout,
  payment:screenPayment, track:screenTrack, revenue:screenRevenue,
  utilization:screenUtilization, dashboard:screenDashboard
};

function render() {
  const view = document.getElementById('view');
  view.innerHTML = `<div class="wrap">${SCREENS[state.screen]()}</div>`;
  document.documentElement.lang = state.lang;
  document.querySelectorAll('[data-nav]').forEach(a =>
    a.setAttribute('aria-current', a.dataset.nav === state.screen ? 'page' : 'false'));
  document.querySelectorAll('#typeSeg button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.v === state.type)));
  document.querySelectorAll('.topbar .seg button[data-act="lang"]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.v === state.lang)));
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T(el.dataset.i18n); });
  const chip = document.getElementById('hubChip');
  chip.querySelector('span:last-child').textContent = `${L(hub().name)} · ${hub().load} %`;
  chip.className = 'chip' + (hub().load >= 90 ? ' warn' : '');
  document.getElementById('cartCount').textContent = cartCount();
  document.getElementById('cartCount').style.display = cartCount() ? '' : 'none';
}

/* live re-price without losing the slider handle */
function refreshPrice() {
  if (state.screen === 'checkout') {
    const pane = document.getElementById('pricePane');
    if (pane) pane.innerHTML = pricePaneInner();
    const lv = document.getElementById('loadVal');
    if (lv) lv.textContent = state.cond.load + ' %';
  } else {
    render();
  }
}

/* =============================================================== events == */
function go(screen) {
  state.screen = screen;
  if (location.hash !== '#' + screen) history.replaceState(null, '', '#' + screen);
  render();
  document.getElementById('view').scrollTop = 0;
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;

  if (act === 'lang') { state.lang = v; render(); return; }
  if (act === 'type') {
    state.type = v;
    state.payMethod = null;
    render(); return;
  }
  if (act === 'hub') { state.hub = v; state.cat = 'all'; render(); return; }
  if (act === 'cat') { state.cat = v; render(); return; }
  if (act === 'assign') { state.order.shipper = 'Trần Quốc Bảo'; state.note = ''; render(); return; }
  if (act === 'brand') { go('menu'); return; }
  if (act === 'go') { go(v); return; }
  if (act === 'add') {
    const l = state.cart.find(x => x.id === v);
    if (l) l.qty += 1; else state.cart.push({ id:v, qty:1 });
    render(); return;
  }
  if (act === 'inc') { state.cart.find(x => x.id === v).qty += 1; render(); return; }
  if (act === 'dec') {
    const l = state.cart.find(x => x.id === v);
    l.qty -= 1;
    if (l.qty <= 0) state.cart = state.cart.filter(x => x.id !== v);
    render(); return;
  }
  if (act === 'voucher') { state.voucher = v || null; render(); return; }
  if (act === 'pay') { state.payMethod = v; render(); return; }

  if (act === 'place') {
    state.order.method = state.payMethod;
    state.order.status = 'Placed';
    state.order.at = state.cond.time;
    state.order.log = [{ from:'—', to:'Placed', role:'customer', at:state.cond.time }];
    state.note = T('orderPlaced');
    go('track');
    return;
  }
  if (act === 'role') { state.role = v; state.note = ''; render(); return; }
  if (act === 'move') {
    const t = TRANSITIONS.find(x => x.from === state.order.status && x.to === v && x.roles.includes(state.role));
    if (!t) { state.note = T('rejected') + ': ' + state.order.status + ' → ' + v; render(); return; }
    if (v === 'Delivered' && state.order.method === 'cod' && !state.order.cash) {
      state.note = T('rejected') + ': BR14 — ' + T('cashConfirm'); render(); return;
    }
    state.order.log.push({ from:state.order.status, to:v, role:state.role, at:state.cond.time });
    state.order.status = v;
    state.note = '';
    render(); return;
  }
  if (act === 'illegal') {
    const legal = TRANSITIONS.some(t => t.from === 'Placed' && t.to === 'Preparing');
    state.note = legal ? 'allowed' : T('rejected') + ': Placed → Preparing (BR15)';
    render(); return;
  }
});

document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-cond]');
  if (el) {
    const k = el.dataset.cond;
    state.cond[k] = el.type === 'checkbox' ? el.checked : (k === 'time' ? el.value : Number(el.value));
    refreshPrice();
  }
});

document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-act="cash"]');
  if (el) { state.order.cash = el.checked; render(); }
});

window.addEventListener('hashchange', () => {
  const s = location.hash.replace('#','');
  if (SCREENS[s] && s !== state.screen) { state.screen = s; render(); }
});

/* ================================================================ start == */
state.screen = SCREENS[location.hash.replace('#','')] ? location.hash.replace('#','') : 'hubs';
render();
</script>
