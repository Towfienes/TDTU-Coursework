<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" width="1000" height="960" font-family="Times New Roman, serif">
  <rect x="0" y="0" width="1000" height="960" fill="#ffffff"/>

  <text x="500" y="32" font-size="23" font-weight="bold" text-anchor="middle">SaigonBite — overall use case diagram with actor generalisation</text>

  <!-- ================= SYSTEM BOUNDARY ================= -->
  <rect x="250" y="56" width="600" height="704" fill="#fcfcfc" stroke="#333333" stroke-width="1.8"/>
  <text x="550" y="82" font-size="17" font-weight="bold" text-anchor="middle">SaigonBite platform</text>

  <!-- ========== column L : customer use cases ========== -->
  <ellipse cx="400" cy="130" rx="118" ry="34" fill="#e8f0fb" stroke="#2a5c9a" stroke-width="1.4"/>
  <text x="400" y="126" font-size="17" font-weight="bold" text-anchor="middle">Register account</text>
  <text x="400" y="146" font-size="13" font-style="italic" text-anchor="middle">FR-E1, FR-E2 · BR18</text>

  <ellipse cx="400" cy="266" rx="118" ry="34" fill="#eaf6ea" stroke="#2f7a33" stroke-width="1.8"/>
  <text x="400" y="262" font-size="17" font-weight="bold" text-anchor="middle">D · Place and Manage Orders</text>
  <text x="400" y="282" font-size="13" font-style="italic" text-anchor="middle">FR-D1 – FR-D14</text>

  <ellipse cx="400" cy="402" rx="118" ry="34" fill="#eaf6ea" stroke="#2f7a33" stroke-width="1.4"/>
  <text x="400" y="398" font-size="17" font-weight="bold" text-anchor="middle">Price the order</text>
  <text x="400" y="418" font-size="13" font-style="italic" text-anchor="middle">BR1 – BR12 · pure engine</text>

  <ellipse cx="400" cy="530" rx="118" ry="34" fill="#fdeaea" stroke="#a52a2a" stroke-width="1.4"/>
  <text x="400" y="526" font-size="17" font-weight="bold" text-anchor="middle">Pay the order</text>
  <text x="400" y="546" font-size="13" font-style="italic" text-anchor="middle">FR-P1 – FR-P3 · BR13, BR14</text>

  <!-- ========== column R : management and report use cases ========== -->
  <ellipse cx="760" cy="120" rx="118" ry="34" fill="#fff8e1" stroke="#8a6d00" stroke-width="1.4"/>
  <text x="760" y="116" font-size="17" font-weight="bold" text-anchor="middle">Set heavy-rain flag</text>
  <text x="760" y="136" font-size="13" font-style="italic" text-anchor="middle">FR-S4 · BR5</text>

  <ellipse cx="760" cy="204" rx="118" ry="34" fill="#e8f0fb" stroke="#2a5c9a" stroke-width="1.4"/>
  <text x="760" y="200" font-size="17" font-weight="bold" text-anchor="middle">A · Manage Menu &amp; Brands</text>
  <text x="760" y="220" font-size="13" font-style="italic" text-anchor="middle">FR-A1 – FR-A6 · BR12</text>

  <ellipse cx="760" cy="288" rx="118" ry="34" fill="#e8f0fb" stroke="#2a5c9a" stroke-width="1.4"/>
  <text x="760" y="284" font-size="17" font-weight="bold" text-anchor="middle">B · Manage Hubs &amp; Capacity</text>
  <text x="760" y="304" font-size="13" font-style="italic" text-anchor="middle">FR-B1 – FR-B5 · BR8</text>

  <ellipse cx="760" cy="372" rx="118" ry="34" fill="#e8f0fb" stroke="#2a5c9a" stroke-width="1.4"/>
  <text x="760" y="368" font-size="17" font-weight="bold" text-anchor="middle">C · Manage Vouchers</text>
  <text x="760" y="388" font-size="13" font-style="italic" text-anchor="middle">FR-C1 – FR-C3 · BR9</text>

  <ellipse cx="760" cy="456" rx="118" ry="34" fill="#e8f0fb" stroke="#2a5c9a" stroke-width="1.4"/>
  <text x="760" y="452" font-size="17" font-weight="bold" text-anchor="middle">E · Manage User Accounts</text>
  <text x="760" y="472" font-size="13" font-style="italic" text-anchor="middle">FR-E3, FR-E4 · BR18</text>

  <ellipse cx="760" cy="540" rx="118" ry="34" fill="#e8f0fb" stroke="#2a5c9a" stroke-width="1.4"/>
  <text x="760" y="536" font-size="17" font-weight="bold" text-anchor="middle">R1 · Revenue report</text>
  <text x="760" y="556" font-size="13" font-style="italic" text-anchor="middle">FR-R1 · excludes Cancelled, Failed</text>

  <ellipse cx="760" cy="624" rx="118" ry="34" fill="#e8f0fb" stroke="#2a5c9a" stroke-width="1.4"/>
  <text x="760" y="620" font-size="17" font-weight="bold" text-anchor="middle">R2 · Hub Utilization report</text>
  <text x="760" y="640" font-size="13" font-style="italic" text-anchor="middle">FR-R2 · load, prep time, discounts</text>

  <ellipse cx="760" cy="708" rx="118" ry="34" fill="#e8f0fb" stroke="#2a5c9a" stroke-width="1.8"/>
  <text x="760" y="704" font-size="17" font-weight="bold" text-anchor="middle">F · Manage Deliveries</text>
  <text x="760" y="724" font-size="13" font-style="italic" text-anchor="middle">FR-F1 – FR-F4 · BR14, BR15</text>

  <!-- ========== include arrows ========== -->
  <line x1="400" y1="300" x2="400" y2="360" stroke="#333333" stroke-width="1.2" stroke-dasharray="6,4"/>
  <polygon points="400,368 395,356 405,356" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="412" y="336" font-size="13" font-style="italic">«include»</text>

  <polyline points="518,266 560,266 560,530 522,530" fill="none" stroke="#333333" stroke-width="1.2" stroke-dasharray="6,4"/>
  <polygon points="514,530 526,525 526,535" fill="none" stroke="#333333" stroke-width="1.2"/>
  <text x="572" y="300" font-size="13" font-style="italic">«include»</text>
  <text x="572" y="480" font-size="13" font-style="italic">«include»</text>

  <!-- ========== notes inside the boundary ========== -->
  <rect x="262" y="590" width="238" height="72" fill="#fffde7" stroke="#8a8a00" stroke-width="1"/>
  <text x="272" y="610" font-size="13" font-weight="bold">BR13 — who may pay how</text>
  <text x="272" y="628" font-size="13">Local Customer: MoMo, VNPay, COD</text>
  <text x="272" y="646" font-size="13">Foreign Tourist: Apple Pay, PayPal, COD</text>

  <rect x="262" y="672" width="238" height="72" fill="#fffde7" stroke="#8a8a00" stroke-width="1"/>
  <text x="272" y="692" font-size="13" font-weight="bold">Actor generalisation</text>
  <text x="272" y="710" font-size="13">Both customer types inherit every</text>
  <text x="272" y="728" font-size="13">association of the abstract Customer.</text>

  <!-- ================= ACTORS ================= -->
  <!-- Customer (abstract) : name drawn above the glyph to keep the lines clear -->
  <circle cx="140" cy="126" r="8" fill="none" stroke="#000000" stroke-width="1.4"/>
  <line x1="140" y1="134" x2="140" y2="156" stroke="#000000" stroke-width="1.4"/>
  <line x1="126" y1="142" x2="154" y2="142" stroke="#000000" stroke-width="1.4"/>
  <line x1="140" y1="156" x2="128" y2="174" stroke="#000000" stroke-width="1.4"/>
  <line x1="140" y1="156" x2="152" y2="174" stroke="#000000" stroke-width="1.4"/>
  <text x="140" y="104" font-size="14" font-style="italic" text-anchor="middle">«abstract» Customer</text>

  <!-- Local Customer -->
  <circle cx="60" cy="316" r="8" fill="none" stroke="#000000" stroke-width="1.4"/>
  <line x1="60" y1="324" x2="60" y2="346" stroke="#000000" stroke-width="1.4"/>
  <line x1="46" y1="332" x2="74" y2="332" stroke="#000000" stroke-width="1.4"/>
  <line x1="60" y1="346" x2="48" y2="364" stroke="#000000" stroke-width="1.4"/>
  <line x1="60" y1="346" x2="72" y2="364" stroke="#000000" stroke-width="1.4"/>
  <text x="60" y="382" font-size="13" text-anchor="middle">Local Customer</text>

  <!-- Foreign Tourist -->
  <circle cx="195" cy="316" r="8" fill="none" stroke="#000000" stroke-width="1.4"/>
  <line x1="195" y1="324" x2="195" y2="346" stroke="#000000" stroke-width="1.4"/>
  <line x1="181" y1="332" x2="209" y2="332" stroke="#000000" stroke-width="1.4"/>
  <line x1="195" y1="346" x2="183" y2="364" stroke="#000000" stroke-width="1.4"/>
  <line x1="195" y1="346" x2="207" y2="364" stroke="#000000" stroke-width="1.4"/>
  <text x="195" y="382" font-size="13" text-anchor="middle">Foreign Tourist</text>

  <!-- Kitchen Staff -->
  <circle cx="390" cy="816" r="8" fill="none" stroke="#000000" stroke-width="1.4"/>
  <line x1="390" y1="824" x2="390" y2="846" stroke="#000000" stroke-width="1.4"/>
  <line x1="376" y1="832" x2="404" y2="832" stroke="#000000" stroke-width="1.4"/>
  <line x1="390" y1="846" x2="378" y2="864" stroke="#000000" stroke-width="1.4"/>
  <line x1="390" y1="846" x2="402" y2="864" stroke="#000000" stroke-width="1.4"/>
  <text x="390" y="882" font-size="14" text-anchor="middle">Kitchen Staff</text>

  <!-- Shipper -->
  <circle cx="620" cy="816" r="8" fill="none" stroke="#000000" stroke-width="1.4"/>
  <line x1="620" y1="824" x2="620" y2="846" stroke="#000000" stroke-width="1.4"/>
  <line x1="606" y1="832" x2="634" y2="832" stroke="#000000" stroke-width="1.4"/>
  <line x1="620" y1="846" x2="608" y2="864" stroke="#000000" stroke-width="1.4"/>
  <line x1="620" y1="846" x2="632" y2="864" stroke="#000000" stroke-width="1.4"/>
  <text x="620" y="882" font-size="14" text-anchor="middle">Shipper</text>

  <!-- System Admin : name above the glyph, every line leaves downward -->
  <circle cx="930" cy="150" r="8" fill="none" stroke="#000000" stroke-width="1.4"/>
  <line x1="930" y1="158" x2="930" y2="180" stroke="#000000" stroke-width="1.4"/>
  <line x1="916" y1="166" x2="944" y2="166" stroke="#000000" stroke-width="1.4"/>
  <line x1="930" y1="180" x2="918" y2="198" stroke="#000000" stroke-width="1.4"/>
  <line x1="930" y1="180" x2="942" y2="198" stroke="#000000" stroke-width="1.4"/>
  <text x="930" y="128" font-size="14" text-anchor="middle">System Admin</text>

  <!-- ================= GENERALISATIONS ================= -->
  <line x1="60" y1="308" x2="126" y2="188" stroke="#000000" stroke-width="1.4"/>
  <polygon points="126,180 120,190 132,190" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>
  <line x1="195" y1="308" x2="154" y2="188" stroke="#000000" stroke-width="1.4"/>
  <polygon points="154,180 148,190 160,190" fill="#ffffff" stroke="#000000" stroke-width="1.4"/>

  <!-- ================= ASSOCIATIONS ================= -->
  <line x1="154" y1="140" x2="284" y2="126" stroke="#000000" stroke-width="1.2"/>
  <line x1="152" y1="152" x2="284" y2="258" stroke="#000000" stroke-width="1.2"/>

  <line x1="930" y1="198" x2="880" y2="120" stroke="#333333" stroke-width="1"/>
  <line x1="930" y1="198" x2="880" y2="204" stroke="#333333" stroke-width="1"/>
  <line x1="930" y1="198" x2="880" y2="288" stroke="#333333" stroke-width="1"/>
  <line x1="930" y1="198" x2="880" y2="372" stroke="#333333" stroke-width="1"/>
  <line x1="930" y1="198" x2="880" y2="456" stroke="#333333" stroke-width="1"/>
  <line x1="930" y1="198" x2="880" y2="540" stroke="#333333" stroke-width="1"/>
  <line x1="930" y1="198" x2="880" y2="624" stroke="#333333" stroke-width="1"/>
  <line x1="930" y1="198" x2="880" y2="706" stroke="#333333" stroke-width="1"/>

  <line x1="404" y1="832" x2="640" y2="714" stroke="#000000" stroke-width="1.2"/>
  <line x1="634" y1="832" x2="754" y2="744" stroke="#000000" stroke-width="1.2"/>

  <text x="500" y="912" font-size="15" font-style="italic" text-anchor="middle">Figure 2.1.1: Overall use case diagram of SaigonBite, with the abstract Customer generalising Local Customer and</text>
  <text x="500" y="934" font-size="15" font-style="italic" text-anchor="middle">Foreign Tourist, and the two «include» steps of use case D</text>
</svg>
