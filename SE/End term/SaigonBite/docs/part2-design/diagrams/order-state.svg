<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" width="1000" height="960" font-family="Times New Roman, serif">
  <rect x="0" y="0" width="1000" height="960" fill="#ffffff"/>

  <text x="500" y="34" font-size="24" font-weight="bold" text-anchor="middle">Order lifecycle — eight states and the eight transitions of Section 2C (BR15, BR16)</text>
  <text x="500" y="58" font-size="15" font-style="italic" text-anchor="middle">Every arrow carries the actor the transition table permits and the guard the business layer checks</text>

  <!-- ================= ROW 1 ================= -->
  <circle cx="42" cy="211" r="9" fill="#000000"/>
  <line x1="51" y1="211" x2="66" y2="211" stroke="#000000" stroke-width="1.6"/>
  <polygon points="70,211 60,206 60,216" fill="#000000"/>

  <rect x="70" y="176" width="140" height="70" fill="#f7f9fc" stroke="#2a5c9a" stroke-width="1.6" rx="6"/>
  <text x="140" y="216" font-size="17" font-weight="bold" text-anchor="middle">Placed</text>

  <rect x="320" y="176" width="140" height="70" fill="#f7f9fc" stroke="#2a5c9a" stroke-width="1.6" rx="6"/>
  <text x="390" y="216" font-size="17" font-weight="bold" text-anchor="middle">Confirmed</text>

  <rect x="570" y="176" width="140" height="70" fill="#f7f9fc" stroke="#2a5c9a" stroke-width="1.6" rx="6"/>
  <text x="640" y="216" font-size="17" font-weight="bold" text-anchor="middle">Preparing</text>

  <rect x="820" y="176" width="140" height="70" fill="#f7f9fc" stroke="#2a5c9a" stroke-width="1.6" rx="6"/>
  <text x="890" y="216" font-size="17" font-weight="bold" text-anchor="middle">Ready</text>

  <line x1="210" y1="211" x2="314" y2="211" stroke="#245c27" stroke-width="1.6"/>
  <polygon points="320,211 310,206 310,216" fill="#245c27"/>
  <text x="265" y="140" font-size="14" font-weight="bold" fill="#245c27" text-anchor="middle">«Kitchen Staff»</text>
  <text x="265" y="160" font-size="13" font-style="italic" text-anchor="middle">[staff.HubId = order.HubId]</text>

  <line x1="460" y1="211" x2="564" y2="211" stroke="#245c27" stroke-width="1.6"/>
  <polygon points="570,211 560,206 560,216" fill="#245c27"/>
  <text x="515" y="140" font-size="14" font-weight="bold" fill="#245c27" text-anchor="middle">«Kitchen Staff»</text>
  <text x="515" y="160" font-size="13" font-style="italic" text-anchor="middle">[no extra guard]</text>

  <line x1="710" y1="211" x2="814" y2="211" stroke="#245c27" stroke-width="1.6"/>
  <polygon points="820,211 810,206 810,216" fill="#245c27"/>
  <text x="765" y="140" font-size="14" font-weight="bold" fill="#245c27" text-anchor="middle">«Kitchen Staff»</text>
  <text x="765" y="160" font-size="13" font-style="italic" text-anchor="middle">[no extra guard]</text>

  <!-- ================= ROW 2 ================= -->
  <rect x="40" y="390" width="380" height="70" fill="#eeeeee" stroke="#555555" stroke-width="1.8" rx="6"/>
  <text x="230" y="420" font-size="17" font-weight="bold" text-anchor="middle">Cancelled</text>
  <text x="230" y="442" font-size="13" font-style="italic" text-anchor="middle">terminal</text>

  <rect x="760" y="390" width="220" height="70" fill="#f7f9fc" stroke="#2a5c9a" stroke-width="1.6" rx="6"/>
  <text x="870" y="430" font-size="17" font-weight="bold" text-anchor="middle">Out for Delivery</text>

  <line x1="140" y1="246" x2="140" y2="384" stroke="#1f6f8b" stroke-width="1.6"/>
  <polygon points="140,390 135,380 145,380" fill="#1f6f8b"/>
  <text x="152" y="296" font-size="14" font-weight="bold" fill="#1f6f8b">«Customer» or «Kitchen Staff»</text>
  <text x="152" y="316" font-size="13" font-style="italic">[staff must give a reason — BR16, A5]</text>

  <line x1="390" y1="246" x2="390" y2="384" stroke="#6b3fa0" stroke-width="1.6"/>
  <polygon points="390,390 385,380 395,380" fill="#6b3fa0"/>
  <text x="402" y="296" font-size="14" font-weight="bold" fill="#6b3fa0">«Customer» or «Admin»</text>
  <text x="402" y="316" font-size="13" font-style="italic">[admin must give a reason — A5]</text>

  <line x1="890" y1="246" x2="890" y2="384" stroke="#a52a2a" stroke-width="1.6"/>
  <polygon points="890,390 885,380 895,380" fill="#a52a2a"/>
  <text x="878" y="296" font-size="14" font-weight="bold" fill="#a52a2a" text-anchor="end">«Shipper»</text>
  <text x="878" y="316" font-size="13" font-style="italic" text-anchor="end">[a shipper is assigned — A1]</text>

  <!-- ================= ROW 3 ================= -->
  <rect x="620" y="560" width="160" height="70" fill="#eeeeee" stroke="#555555" stroke-width="1.8" rx="6"/>
  <text x="700" y="590" font-size="17" font-weight="bold" text-anchor="middle">Delivered</text>
  <text x="700" y="612" font-size="13" font-style="italic" text-anchor="middle">terminal</text>

  <rect x="830" y="560" width="160" height="70" fill="#eeeeee" stroke="#555555" stroke-width="1.8" rx="6"/>
  <text x="910" y="590" font-size="17" font-weight="bold" text-anchor="middle">Failed</text>
  <text x="910" y="612" font-size="13" font-style="italic" text-anchor="middle">terminal</text>

  <line x1="800" y1="460" x2="702" y2="554" stroke="#a52a2a" stroke-width="1.6"/>
  <polygon points="700,560 696,549 706,553" fill="#a52a2a"/>
  <text x="688" y="504" font-size="14" font-weight="bold" fill="#a52a2a" text-anchor="end">«Shipper»</text>
  <text x="688" y="524" font-size="13" font-style="italic" text-anchor="end">[COD: cash confirmed — BR14]</text>

  <line x1="930" y1="460" x2="912" y2="554" stroke="#a52a2a" stroke-width="1.6"/>
  <polygon points="910,560 906,549 916,553" fill="#a52a2a"/>
  <text x="898" y="504" font-size="14" font-weight="bold" fill="#a52a2a" text-anchor="end">«Shipper»</text>
  <text x="898" y="524" font-size="13" font-style="italic" text-anchor="end">[customer unreachable — A2]</text>

  <!-- terminal pseudostates -->
  <line x1="230" y1="460" x2="230" y2="508" stroke="#555555" stroke-width="1.4"/>
  <circle cx="230" cy="528" r="12" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <circle cx="230" cy="528" r="6" fill="#555555"/>

  <line x1="700" y1="630" x2="700" y2="658" stroke="#555555" stroke-width="1.4"/>
  <circle cx="700" cy="674" r="12" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <circle cx="700" cy="674" r="6" fill="#555555"/>

  <line x1="910" y1="630" x2="910" y2="658" stroke="#555555" stroke-width="1.4"/>
  <circle cx="910" cy="674" r="12" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <circle cx="910" cy="674" r="6" fill="#555555"/>

  <!-- ================= LEGEND ================= -->
  <rect x="40" y="700" width="400" height="176" fill="#f7f7f7" stroke="#555555" stroke-width="1.2"/>
  <text x="54" y="724" font-size="15" font-weight="bold">Legend</text>
  <rect x="54" y="736" width="16" height="12" fill="#1f6f8b"/>
  <text x="80" y="747" font-size="14">Customer — cancel only, in Placed or Confirmed</text>
  <rect x="54" y="760" width="16" height="12" fill="#245c27"/>
  <text x="80" y="771" font-size="14">Kitchen Staff — confirm, prepare, mark ready</text>
  <rect x="54" y="784" width="16" height="12" fill="#a52a2a"/>
  <text x="80" y="795" font-size="14">Shipper — pick up, deliver, report failure</text>
  <rect x="54" y="808" width="16" height="12" fill="#6b3fa0"/>
  <text x="80" y="819" font-size="14">Admin — cancel a Confirmed order</text>
  <circle cx="62" cy="839" r="6" fill="#000000"/>
  <text x="80" y="844" font-size="14">initial state — Placed is the only entry point</text>
  <circle cx="62" cy="864" r="8" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <circle cx="62" cy="864" r="4" fill="#555555"/>
  <text x="80" y="869" font-size="14">terminal state — no outgoing transition</text>

  <!-- ================= NOTE ================= -->
  <rect x="470" y="700" width="490" height="176" fill="#fffde7" stroke="#8a8a00" stroke-width="1.2"/>
  <text x="484" y="724" font-size="15" font-weight="bold">How the diagram is enforced</text>
  <text x="484" y="750" font-size="14">OrderStateMachine.CanTransition(from, to, actor) returns</text>
  <text x="484" y="770" font-size="14">Allowed = false for every pair not drawn here, whatever the</text>
  <text x="484" y="790" font-size="14">screen offered (BR15, NFR6). AllowedNext only shapes buttons.</text>
  <text x="484" y="816" font-size="14">Placed → Preparing is the canonical illegal attempt: the pair is</text>
  <text x="484" y="836" font-size="14">absent from this diagram, so the business layer rejects it even</text>
  <text x="484" y="856" font-size="14">though no screen ever renders that button.</text>

  <text x="500" y="912" font-size="15" font-style="italic" text-anchor="middle">Figure 2.3.3: Order state diagram — eight states, eight permitted transitions, the actor of each and the guard</text>
  <text x="500" y="934" font-size="15" font-style="italic" text-anchor="middle">the business layer evaluates (BR15, BR16 — Section 2C of the Project Requirements)</text>
</svg>
